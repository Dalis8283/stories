<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="icon.ico">
  <title>Story Repository</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
  <script>
    (function(){
      var t; try { t = localStorage.getItem("story-theme"); } catch(e) {}
      if (!t) t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <style>
:root{
  --bg:#FAFAF8; --surface:#FFFFFF; --ink:#101318; --muted:#5E646E; --line:#E3E4E8; --line-strong:#B9BDC6;
  --hl:#FFE14D; --btn-bg:#101318; --btn-ink:#FFFFFF; --overlay:rgba(16,19,24,.45);
  --display:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --read:"Literata",Charter,"Iowan Old Style","Palatino Linotype",Georgia,serif;
}
:root[data-theme="dark"]{
  --bg:#0E0F12; --surface:#16181D; --ink:#EDEDF0; --muted:#9A9EA9; --line:#262931; --line-strong:#4A4E59;
  --hl:rgba(255,214,10,.42); --btn-bg:#FFD60A; --btn-ink:#101318; --overlay:rgba(0,0,0,.65);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
body{font-family:var(--display);background:var(--bg);color:var(--ink);line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.page{max-width:1080px;margin:0 auto;padding:clamp(1rem,3vw,2rem) clamp(1rem,4vw,2rem) 5rem}
button,input,a{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:4px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* highlighter */
.hl{background-image:linear-gradient(var(--hl),var(--hl));background-repeat:no-repeat;background-position:0 90%;background-size:0% 48%;-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background-size .3s ease}
mark{background:transparent;background-image:linear-gradient(var(--hl),var(--hl));background-repeat:no-repeat;background-position:0 90%;background-size:100% 48%;color:inherit}

/* top + hero */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:clamp(1.5rem,6vw,3.5rem)}
.brandmark{display:inline-flex;align-items:center;gap:.5rem;font-weight:600;color:var(--muted);font-size:.95rem}
.icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line-strong);color:var(--ink);flex:none;transition:background .15s}
.icon-btn:hover{background:var(--surface)}
.icon-btn .moon{display:none}
:root[data-theme="dark"] .icon-btn .sun{display:none}
:root[data-theme="dark"] .icon-btn .moon{display:block}
h1{font-size:clamp(2.7rem,10.5vw,6rem);font-weight:800;letter-spacing:-.045em;line-height:.95;max-width:12ch}
.lede{margin-top:1.1rem;color:var(--muted);font-size:1.1rem;max-width:44ch}

.finder{margin-top:clamp(1.5rem,4vw,2.5rem)}
.search{display:flex;align-items:center;gap:.8rem;border-bottom:2.5px solid var(--ink);padding:.3rem 0 .55rem}
.search:focus-within{border-bottom-color:var(--ink)}
.search svg{width:1.6rem;height:1.6rem}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:clamp(1.25rem,4.5vw,1.9rem);font-weight:500;letter-spacing:-.01em;color:var(--ink);padding:.2rem 0}
.search input::placeholder{color:var(--muted);opacity:.75}
.search input::-webkit-outer-spin-button,.search input::-webkit-inner-spin-button{-webkit-appearance:none}
.search input[type=number]{-moz-appearance:textfield}
kbd{font:600 .8rem/1 var(--display);border:1.5px solid var(--line-strong);border-radius:6px;padding:.3rem .5rem;color:var(--muted)}
.search:focus-within kbd,.search.has-value kbd{display:none}
.clear{display:none;width:36px;height:36px;border-radius:50%;place-items:center;color:var(--muted)}
.clear:hover{background:var(--line)}
.search.has-value .clear{display:grid}
.finder-row{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1.4rem;margin-top:1rem}
.tabs{display:inline-flex;gap:1.1rem}
.tab{font-weight:600;color:var(--muted);padding:.35rem 0;border-bottom:3px solid transparent}
.tab[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--hl)}
.tab:hover{color:var(--ink)}
:root[data-theme="dark"] .tab[aria-pressed="true"]{border-bottom-color:#FFD60A}
.tab.toggle[aria-pressed="true"]::before{content:"✓ "}
.spacer{flex:1}
.btn{height:46px;padding:0 1.3rem;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:.55rem;font-weight:700;background:var(--btn-bg);color:var(--btn-ink);text-decoration:none;transition:transform .12s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line-strong)}
.btn.ghost:hover{background:var(--surface)}

.bookmark{display:none;align-items:center;gap:.7rem;margin-top:1.4rem;text-decoration:none;padding:.75rem 1rem;border:1.5px dashed var(--line-strong);border-radius:12px;max-width:100%}
.bookmark.show{display:flex}
.bookmark small{display:block;color:var(--muted);font-size:.8rem}
.bookmark .bt{font-family:var(--read);font-weight:600;overflow-wrap:anywhere}
.bookmark:hover .hl{background-size:100% 48%}

/* layout */
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:clamp(2rem,5vw,4rem);margin-top:clamp(2.5rem,7vw,4.5rem);align-items:start;min-width:0}
.layout>*{min-width:0}
.rail{position:sticky;top:1.5rem}
.rail h3{font-size:.85rem;color:var(--muted);font-weight:600;margin-bottom:.6rem}
.rail ul{list-style:none;display:grid;gap:.15rem}
.rail button.item{width:100%;display:flex;align-items:baseline;gap:.6rem;text-align:left;padding:.45rem .2rem;border-radius:6px}
.rail .name{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere;line-height:1.3}
.rail .num{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.9rem}
.rail button.item:hover .hl,.rail button.item.active .hl{background-size:100% 48%}
.rail .links{margin-top:1.1rem;display:flex;flex-direction:column;align-items:flex-start;gap:.3rem}
.link-btn{font-weight:600;color:var(--muted);font-size:.92rem;padding:.2rem 0;text-decoration:underline;text-underline-offset:3px}
.link-btn:hover{color:var(--ink)}

.status{color:var(--muted);font-size:.95rem;margin-bottom:1.6rem}
.collection{margin-bottom:3rem;scroll-margin-top:1rem}
.collection h2{font-size:inherit}
.c-head{display:flex;align-items:center;gap:.75rem;width:100%;text-align:left;padding:.4rem 0 .8rem;border-bottom:2.5px solid var(--ink)}
.c-title{font-size:clamp(1.6rem,5vw,2.3rem);font-weight:800;letter-spacing:-.03em;line-height:1.1;overflow-wrap:anywhere}
.c-glyph{font-size:1.5rem}
.c-count{margin-left:auto;color:var(--muted);font-size:.95rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.chev{color:var(--muted);transition:transform .2s}
.collection:not(.closed) .chev{transform:rotate(90deg)}
.toc{list-style:none;padding-top:.4rem}
.collection.closed .toc{display:none}
.story{display:flex;align-items:baseline;padding:.6rem .1rem;text-decoration:none;min-height:44px}
.story .n{width:2.9rem;flex:none;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600;font-size:.9rem}
.story .t{font-family:var(--read);font-size:1.08rem;line-height:1.4;flex:0 1 auto;min-width:0;overflow-wrap:anywhere}
.story .lead{flex:1 1 1rem;min-width:1rem;border-bottom:2px dotted var(--line-strong);margin:0 .7rem;transform:translateY(-.3em)}
.story .st{flex:none;color:var(--muted);font-size:.8rem;font-weight:600;display:inline-flex;align-items:center;gap:.3rem}
.story:hover .hl,.story:focus-visible .hl{background-size:100% 48%}
.story.read .t{color:var(--muted)}
.story.read .st{color:var(--ink)}

.empty{display:none;padding:2rem 0}
.empty.show{display:block}
.empty p{font-family:var(--read);font-size:1.3rem;margin-bottom:1rem}

/* random pick dialog */
dialog{margin:auto;border:0;background:var(--surface);color:var(--ink);border-radius:20px;width:min(560px,calc(100% - 2rem));padding:0;box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
dialog::backdrop{background:var(--overlay)}
dialog[open]{animation:rise .25s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.pd{padding:clamp(1.4rem,5vw,2.2rem)}
.pd-label{color:var(--muted);font-weight:600;font-size:.9rem}
.pd-title{font-family:var(--read);font-size:clamp(1.7rem,6vw,2.4rem);font-weight:600;line-height:1.2;letter-spacing:-.015em;margin:.6rem 0 .5rem;overflow-wrap:anywhere}
.pd-title .hl{transition:none}
.pd-title.swipe .hl{animation:swipe .7s .12s ease-out forwards}
@keyframes swipe{to{background-size:100% 48%}}
.pd-meta{color:var(--muted)}
.pd-actions{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1.6rem}
.pd-close{position:absolute;top:.9rem;right:.9rem}

.to-top{margin-top:1rem}

/* narrow screens: rail becomes a sticky chip bar */
@media (max-width:860px){
  .layout{grid-template-columns:1fr;gap:0;margin-top:2rem}
  .rail{position:sticky;top:0;z-index:5;min-width:0;background:var(--bg);margin:0 calc(-1 * clamp(1rem,4vw,2rem)) 1.5rem;padding:.7rem clamp(1rem,4vw,2rem);border-bottom:1.5px solid var(--line)}
  .rail h3,.rail .links{display:none}
  .rail ul{display:flex;overflow-x:auto;gap:.5rem;scrollbar-width:none;padding-bottom:2px}
  .rail ul::-webkit-scrollbar{display:none}
  .rail li{flex:none}
  .rail button.item{border:1.5px solid var(--line-strong);border-radius:999px;padding:.4rem .9rem;white-space:nowrap}
  .rail .num{display:none}
  .rail button.item.active{border-color:var(--ink)}
  .collection{scroll-margin-top:4.5rem}
}
@media (max-width:560px){
  .story .lead{display:none}
  .story .st{margin-left:auto;padding-left:.7rem}
  .story .n{width:2.6rem}
  .finder-row .spacer{display:none}
  .finder-row .btn{width:100%}
  .pd-actions .btn{flex:1 1 100%}
  .pd-actions .btn.ghost{flex:1 1 calc(50% - .3rem)}
  dialog{margin:auto 1rem 1rem;width:calc(100% - 2rem)}
  kbd{display:none}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation-duration:.01ms!important;transition:none!important}.pd-title .hl{background-size:100% 48%}}
</style>
</head>

      "The_New_Rules 📝": ["Fort_of_Fantasy.html","The_New_Rules.html"],
      "Oneshot 🔖": ["Enjoying_View_01to02.html","Little_Susies_Suppository_Ordeal.html","Lilys_Embarrassing_Punishment.html","Lisa_On_the_Beach.html","Jackson_Three_Bares.html","Babysitting_Em_01.html","Child_Protective_Court.html","Failure_To_Communicate.html","Summer_That_Changed_Everything_01to07.html","TAE_Tiffany_Anson_Exposed.html"],

      "Temple_of_Venus 🛕": ["Temple_of_Venus_01.html","Temple_of_Venus_02to03.html"],
      "Misty_Jones": ["Girlfriend's_Arrest.html","Girlfriend's_Arrest_2.html","The_Halloween_Costume.html","Caught_and_Punished.html"]
    };

    const baseFolder = ".";

(function(){
  const $ = id => document.getElementById(id);
  const els = {
    input:$("searchInput"), search:$("searchBox"), clear:$("clearBtn"), modeText:$("modeText"), modeNum:$("modeNum"),
    surprise:$("surpriseBtn"), list:$("collections"), status:$("statusText"), lede:$("lede"),
    toggleAll:$("toggleAll"), unread:$("unreadBtn"), rail:$("railList"), railLinks:$("railLinks"),
    empty:$("empty"), emptyQuery:$("emptyQuery"), emptyClear:$("emptyClear"), theme:$("themeBtn"),
    cont:$("bookmark"), contTitle:$("bookmarkTitle"),
    dlg:$("pickDialog"), pickTitle:$("pickTitle"), pickText:$("pickText"), pickMeta:$("pickMeta"),
    pickOpen:$("pickOpen"), pickAgain:$("pickAgain"), pickFind:$("pickFind"), pickClose:$("pickClose")
  };

  const emojiRe = /\p{Extended_Pictographic}[\p{Extended_Pictographic}\u200d\ufe0f\u{1F3FB}-\u{1F3FF}]*/gu;
  const prettify = s => s.replaceAll("_"," ").replace(/\.(html|pdf)$/i,"").replace(/\s+/g," ").trim();
  const actualFolder = name => name.split(" ")[0];
  const displayFolder = name => prettify(name.replace(emojiRe,""));
  const folderGlyph = name => (name.match(emojiRe) || [""])[0];
  const urlFor = (folder,file) => baseFolder + "/" + encodeURIComponent(actualFolder(folder)) + "/" + encodeURIComponent(file);
  const pad = n => String(n).padStart(3,"0");
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const store = {
    get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
    set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
  };

  let n = 1;
  const collections = Object.entries(repository).map(([key, files], idx) => ({
    key, id: "c" + idx, name: displayFolder(key), glyph: folderGlyph(key),
    items: files.map(file => ({ number: n++, file, title: prettify(file), pdf: /\.pdf$/i.test(file), url: urlFor(key,file) }))
  }));
  collections.forEach(c => c.items.forEach(i => i.folder = c));
  const all = collections.flatMap(c => c.items);
  const byUrl = new Map(all.map(i => [i.url, i]));

  const readSet = new Set(store.get("story-read", []));
  let lastUrl = store.get("story-last", null);
  const closedSet = new Set(collections.length > 6 ? collections.map(c => c.key) : []);
  let mode = "text", pick = null, unreadOnly = false, observer = null;

  function markRead(item){
    readSet.add(item.url); lastUrl = item.url;
    store.set("story-read", [...readSet]); store.set("story-last", lastUrl);
    render();
  }

  function withHighlight(text, q){
    const span = document.createElement("span"); span.className = "hl";
    const i = q ? text.toLowerCase().indexOf(q) : -1;
    if (i < 0){ span.textContent = text; return span; }
    span.append(text.slice(0,i));
    const m = document.createElement("mark"); m.textContent = text.slice(i, i+q.length); span.append(m);
    span.append(text.slice(i+q.length));
    return span;
  }

  function matches(item, q){
    if (unreadOnly && readSet.has(item.url)) return false;
    if (!q) return true;
    if (mode === "number") return String(item.number).startsWith(q.replace(/\D/g,""));
    return item.title.toLowerCase().includes(q) || item.folder.name.toLowerCase().includes(q) ||
           String(item.number).includes(q.replace(/^#0*/,""));
  }

  const CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';
  const CHEV = '<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>';

  function render(){
    const raw = els.input.value.trim();
    const q = mode === "number" ? raw.replace(/\D/g,"") : raw.toLowerCase();
    const filtering = !!q;
    els.list.textContent = ""; els.rail.textContent = "";
    let shown = 0, groups = 0;

    collections.forEach(c => {
      const hits = c.items.filter(i => matches(i,q));
      if (!hits.length) return;
      shown += hits.length; groups++;
      const isOpen = filtering || !closedSet.has(c.key);
      const readCount = c.items.filter(i => readSet.has(i.url)).length;

      // rail entry
      const li = document.createElement("li");
      const item = document.createElement("button");
      item.type = "button"; item.className = "item"; item.dataset.target = c.id;
      const nm = document.createElement("span"); nm.className = "name"; nm.append(withHighlight(c.name, ""));
      const ct = document.createElement("span"); ct.className = "num"; ct.textContent = hits.length;
      item.append(nm, ct); li.append(item); els.rail.append(li);
      item.addEventListener("click", () => {
        const sec = document.getElementById(c.id); if (!sec) return;
        closedSet.delete(c.key); sec.classList.remove("closed");
        sec.querySelector(".c-head").setAttribute("aria-expanded","true");
        sec.scrollIntoView({behavior: reduceMotion ? "auto" : "smooth", block:"start"});
      });

      // section
      const sec = document.createElement("section");
      sec.className = "collection" + (isOpen ? "" : " closed"); sec.id = c.id;
      const h2 = document.createElement("h2");
      const head = document.createElement("button");
      head.type = "button"; head.className = "c-head"; head.setAttribute("aria-expanded", String(isOpen));
      head.innerHTML = '<span class="c-glyph" aria-hidden="true"></span><span class="c-title"></span><span class="c-count"></span>' + CHEV;
      head.querySelector(".c-glyph").textContent = c.glyph;
      if (!c.glyph) head.querySelector(".c-glyph").remove();
      head.querySelector(".c-title").append(withHighlight(c.name, mode==="text" ? q : "").cloneNode(true));
      const total = c.items.length;
      head.querySelector(".c-count").textContent = ((filtering || unreadOnly) ? hits.length + " of " + total : total) +
        (total === 1 ? " story" : " stories") + (readCount ? " · " + readCount + " read" : "");
      head.addEventListener("click", () => {
        const closed = sec.classList.toggle("closed");
        head.setAttribute("aria-expanded", String(!closed));
        if (closed) closedSet.add(c.key); else closedSet.delete(c.key);
        updateToggleAll();
      });
      h2.append(head);

      const ul = document.createElement("ul"); ul.className = "toc";
      hits.forEach(i => {
        const row = document.createElement("li");
        const a = document.createElement("a");
        const isRead = readSet.has(i.url);
        a.className = "story" + (isRead ? " read" : ""); a.href = i.url; a.target = "_blank"; a.rel = "noopener";
        const num = document.createElement("span"); num.className = "n"; num.textContent = pad(i.number);
        const t = document.createElement("span"); t.className = "t"; t.append(withHighlight(i.title, mode==="text" ? q : ""));
        const lead = document.createElement("span"); lead.className = "lead"; lead.setAttribute("aria-hidden","true");
        const st = document.createElement("span"); st.className = "st";
        if (isRead) st.innerHTML = CHECK + '<span class="sr-only">Read</span>';
        else if (i.pdf) st.textContent = "PDF";
        a.append(num, t, lead, st);
        a.addEventListener("click", () => setTimeout(() => markRead(i), 0));
        row.append(a); ul.append(row);
      });
      sec.append(h2, ul); els.list.append(sec);
    });

    const readTotal = all.filter(i => readSet.has(i.url)).length;
    els.lede.textContent = all.length + (all.length === 1 ? " story" : " stories") + " across " + collections.length +
      (collections.length === 1 ? " collection" : " collections") + (readTotal ? ", " + readTotal + " read so far." : ".");
    els.status.textContent = (filtering || unreadOnly)
      ? "Showing " + shown + " of " + all.length + (filtering ? " matching stories" : " unread stories") : "";
    els.status.style.display = els.status.textContent ? "" : "none";
    els.empty.classList.toggle("show", shown === 0);
    els.emptyQuery.textContent = raw || (unreadOnly ? "unread" : "");
    els.toggleAll.style.display = filtering || groups < 2 ? "none" : "";
    els.unread.style.display = readTotal || unreadOnly ? "" : "none";
    els.search.classList.toggle("has-value", !!raw);

    const last = lastUrl && byUrl.get(lastUrl);
    els.cont.classList.toggle("show", !!last && !filtering);
    if (last){ els.cont.href = last.url; els.contTitle.textContent = last.title; }
    updateToggleAll(); observe();
  }

  function updateToggleAll(){
    els.toggleAll.textContent = closedSet.size === 0 ? "Collapse all" : "Expand all";
  }

  function observe(){
    if (observer) observer.disconnect();
    if (!("IntersectionObserver" in window)) return;
    observer = new IntersectionObserver(entries => {
      entries.forEach(en => { if (en.isIntersecting){
        els.rail.querySelectorAll(".item").forEach(b => b.classList.toggle("active", b.dataset.target === en.target.id));
        const act = els.rail.querySelector(".item.active");
        if (act && act.scrollIntoView && innerWidth <= 860) act.scrollIntoView({block:"nearest", inline:"center"});
      }});
    }, {rootMargin:"-15% 0px -75% 0px"});
    els.list.querySelectorAll(".collection").forEach(s => observer.observe(s));
  }

  function setMode(m, keepValue){
    mode = m;
    const num = m === "number";
    els.modeText.setAttribute("aria-pressed", String(!num));
    els.modeNum.setAttribute("aria-pressed", String(num));
    els.input.type = num ? "number" : "text";
    els.input.inputMode = num ? "numeric" : "text";
    els.input.placeholder = num ? "Type a story number" : "Search stories and collections";
    if (!keepValue) els.input.value = "";
    els.input.focus(); render();
  }

  function showPick(){
    const pool = all.filter(i => !unreadOnly || !readSet.has(i.url));
    if (!pool.length) return;
    let next; do { next = pool[Math.floor(Math.random()*pool.length)]; } while (pool.length > 1 && pick && next.number === pick.number);
    pick = next;
    els.pickText.textContent = pick.title;
    els.pickMeta.textContent = "#" + pad(pick.number) + " in " + pick.folder.name;
    els.pickOpen.href = pick.url;
    if (!els.dlg.open) els.dlg.showModal();
    els.pickTitle.classList.remove("swipe"); void els.pickTitle.offsetWidth; els.pickTitle.classList.add("swipe");
  }

  els.input.addEventListener("input", render);
  const clearSearch = () => { els.input.value = ""; render(); els.input.focus(); };
  els.clear.addEventListener("click", clearSearch);
  els.emptyClear.addEventListener("click", () => { unreadOnly = false; els.unread.setAttribute("aria-pressed","false"); clearSearch(); });
  els.modeText.addEventListener("click", () => setMode("text"));
  els.modeNum.addEventListener("click", () => setMode("number"));
  els.surprise.addEventListener("click", showPick);
  els.pickAgain.addEventListener("click", showPick);
  els.pickClose.addEventListener("click", () => els.dlg.close());
  els.dlg.addEventListener("click", e => { if (e.target === els.dlg) els.dlg.close(); });
  els.pickOpen.addEventListener("click", () => { if (pick) { const p = pick; els.dlg.close(); setTimeout(() => markRead(p), 0); } });
  els.pickFind.addEventListener("click", () => {
    els.dlg.close(); els.input.value = String(pick.number); setMode("number", true);
    els.list.scrollIntoView({behavior: reduceMotion ? "auto" : "smooth", block:"start"});
  });
  els.cont.addEventListener("click", () => { const l = byUrl.get(lastUrl); if (l) setTimeout(() => markRead(l), 0); });
  els.toggleAll.addEventListener("click", () => {
    if (closedSet.size === 0) collections.forEach(c => closedSet.add(c.key)); else closedSet.clear();
    render();
  });
  els.unread.addEventListener("click", () => {
    unreadOnly = !unreadOnly; els.unread.setAttribute("aria-pressed", String(unreadOnly)); render();
  });
  els.theme.addEventListener("click", () => {
    const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("story-theme", next); } catch(e){}
  });
  document.addEventListener("keydown", e => {
    const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
    if (e.key === "/" && !typing && !els.dlg.open){ e.preventDefault(); els.input.focus(); }
    if (e.key === "Escape" && document.activeElement === els.input){ els.input.value = ""; render(); }
  });

  render();
})();

  </script>
